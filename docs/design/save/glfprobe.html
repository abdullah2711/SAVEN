<!doctype html><html><head><meta charset="utf-8"></head><body><div id="host"></div><pre id="out" style="position:fixed;inset:0 0 auto 0;z-index:9999;background:#fff;font:11px monospace;white-space:pre-wrap">loading</pre>
<script type="module">
const out=document.getElementById('out');
try{
 let draw=()=>{};
 const {createAccountingUI}=await import('/ui/accounting-ui.js');
 const ui=createAccountingUI({render:()=>draw(),navigate(){},notify(){},dirty(){},getCompany:()=>'Northstar Trading'});
 const host=document.getElementById('host');
 draw=()=>{host.innerHTML='<main class="workspace">'+ui.view('ledger')+'</main>';ui.bind();};
 draw();
 const rows=()=>document.querySelectorAll('#gl-rows tr').length;
 const before=rows();
 const input=document.querySelector('[data-glf="account"]');
 input.value='1010'; input.dispatchEvent(new Event('input',{bubbles:true}));
 const after=rows();
 // sort by party header
 const btn=document.querySelector('[data-gl-sort="party"]');
 if(btn) btn.click();
 const still=rows();
 out.textContent=JSON.stringify({before,after,still});
}catch(e){out.textContent='ERR '+e.message+'\n'+e.stack;}
</script></body></html>
