<!doctype html><html><head><meta charset="utf-8"></head><body><div id="host"></div><pre id="out" style="position:fixed;inset:0 0 auto 0;z-index:9999;background:#fff;font:11px monospace;white-space:pre-wrap">loading</pre>
<script type="module">
const out=document.getElementById('out');const calls=[];
try{
 let draw=()=>{};
 const {createAccountingUI}=await import('/ui/accounting-ui.js');
 const ui=createAccountingUI({render:()=>draw(),navigate:(r)=>calls.push(r),notify:(m)=>calls.push('n:'+m),dirty(){},getCompany:()=>'Northstar Trading'});
 const host=document.getElementById('host');
 draw=()=>{host.innerHTML='<main class="workspace">'+ui.view('cash-reconciliation')+'</main>';ui.bind();};
 host.innerHTML='<main class="workspace">'+ui.editor('cash-reconciliation','')+'</main>';ui.bind();
 const f=document.querySelector('[data-recon-form="cash"]');
 f.elements.account.value='Standard Bank — current 0123456789';
 f.elements.original.value='911760.54';
 f.requestSubmit();
 host.innerHTML='<main class="workspace">'+ui.view('cash-reconciliation')+'</main>';ui.bind();
 const row=document.querySelector('tbody tr');
 out.textContent=JSON.stringify({calls,cells:[...row.querySelectorAll('td')].map(td=>td.textContent.trim())});
}catch(e){out.textContent='ERR '+e.message+'\n'+e.stack;}
</script></body></html>
