<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="/ui/theme.css"></head>
<body style="padding:12px;background:var(--bg)"><div id="host"></div>
<script type="module">
const pre=document.createElement('pre');
pre.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:99999;font:11px monospace;background:#fff;color:#111;padding:6px;margin:0;white-space:pre-wrap';
document.documentElement.appendChild(pre);
try{
 const {createScreens}=await import('/ui/screens.js');
 const {chart}=await import('/ui/accounting-model.js');
 const s=createScreens({getCompany:()=>'Northstar Trading',range:()=>({from:'2026-11-01',to:'2026-11-30'}),accounts:()=>chart,navigate(){},notify(){}});
 document.getElementById('host').innerHTML=s.gl();
 s.bindGL(()=>{});
 const box=document.querySelector('.ms[data-ms="account"]');
 box.querySelector('.ms-trigger').click();
 const boxes=[...box.querySelectorAll('input[name="account"]')];
 boxes[3].click();
 const checked=[...box.querySelectorAll('input[name="account"]')].filter(b=>b.checked).map(b=>b.value);
 pre.textContent='clicked 4th; checked='+JSON.stringify(checked)+' total='+boxes.length;
}catch(e){pre.textContent='ERR '+e.message+'\n'+e.stack}
</script></body></html>
