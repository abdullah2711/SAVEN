<!doctype html><html><head><meta charset="utf-8"></head><body>
<script type="module">
const pre=document.createElement('pre');
pre.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99999;background:#fff;color:#900;font:11px monospace;padding:8px;white-space:pre-wrap;margin:0';
document.documentElement.appendChild(pre);
const log=m=>{pre.textContent+=m+'\n';};
window.addEventListener('error',e=>log('ERR '+e.message+' @'+(e.filename||'')+':'+(e.lineno||'')));
for(const m of ['./screens.js','./accounting-ui.js','./app.js']){
  try{ await import(m); log('ok '+m); }catch(e){ log('FAIL '+m+' :: '+e.name+': '+e.message+'\n'+String(e.stack||'').split('\n').slice(0,4).join('\n')); }
}
</script></body></html>
