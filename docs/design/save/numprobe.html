<!doctype html><html><head><meta charset="utf-8"></head><body><div id="host"></div><pre id="out" style="position:fixed;inset:0 0 auto 0;z-index:9999;background:#fff;font:12px monospace;white-space:pre-wrap">loading</pre>
<script type="module">
const out=document.getElementById('out');
try{
 const {createAccountingUI}=await import('/ui/accounting-ui.js');
 const {NUMBERING}=await import('/ui/accounting-model.js');
 const ui=createAccountingUI({render(){},navigate(){},notify(){},dirty(){},getCompany:()=>'Northstar Trading'});
 document.body.insertAdjacentHTML('beforeend','<div id="host"></div>');
 const host=document.getElementById('host');
 host.innerHTML='<main class="workspace">'+ui.settings('accounting')+'</main>'; ui.bind();
 const f=document.querySelector('[data-settings-save="numbering"]');
 f.elements.journalPrefix.value='JVX'; f.elements.journalNext.value='7'; f.elements.padding.value='4';
 f.requestSubmit();
 ui.prepareNew('journals');
 host.innerHTML='<main class="workspace">'+ui.editor('journals','')+'</main>'; ui.bind();
 out.textContent=JSON.stringify({prefix:NUMBERING.journal.prefix,next:NUMBERING.journal.next,number:document.querySelector('#accounting-journal')?document.querySelector('h2').textContent:''});
}catch(e){out.textContent='ERR '+e.message+'\n'+e.stack;}
</script></body></html>
