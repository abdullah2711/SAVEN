name: Verify SAVEN
on:
  push:
    branches: [testing-1, main]
  pull_request:
    branches: [testing-1, main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.mjs
      - run: python tools/validate_plan.py
      - name: Ensure generated catalog is current
        run: |
          python tools/build_feature_catalog.py
          git diff --exit-code -- docs/feature-catalog.json docs/05-feature-library.md
