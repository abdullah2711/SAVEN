name: Verify SAVEN
on:
  push:
    branches: [testing-1, main]
  pull_request:
    branches: [testing-1, main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: contract-test-only
          POSTGRES_DB: saven_contract_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node scripts/check.mjs
      - run: node --test tests/*.test.mjs
      - name: Native PostgreSQL authority and posting contracts
        run: node scripts/verify-postgres.mjs --initialize
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci
      - name: Company setup, identity and administration contracts
        run: node scripts/verify-operating.mjs --migrate
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci
      - run: python tools/validate_plan.py
      - name: Supplier, settlement and manual-journal contracts
        run: node scripts/verify-accounting-cycles.mjs --migrate
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci
      - name: Ensure generated catalog is current
        if: success()
        run: |
          python tools/build_feature_catalog.py
          git diff --exit-code -- docs/feature-catalog.json docs/05-feature-library.md
      - name: Private files, evidence and assistant authority contracts
        run: node scripts/verify-services.mjs --migrate
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci
      - name: Ledger, linked corrections and bank reconciliation contracts
        run: node scripts/verify-accounting-workspace.mjs --migrate
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci
      - name: Historical party statements, ageing and credit adjustment contracts
        run: node scripts/verify-party-accounting.mjs --migrate
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci
      - name: Opening trial balance, subledger reconciliation and cutoff contracts
        run: node scripts/verify-opening.mjs --migrate
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci

      - name: Recurring journal schedules and occurrence authority contracts
        run: node scripts/verify-recurring.mjs --migrate
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci

      - name: Complete accounting exports and atomic submission evidence
        run: node scripts/verify-exports-evidence.mjs
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci

      - name: Configurable posting authority and evidence policies
        run: node scripts/verify-approval-policies.mjs --migrate
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: contract-test-only
          CONTRACT_DATABASE: saven_contract_ci
